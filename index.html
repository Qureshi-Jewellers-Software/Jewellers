<!doctype html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sarafa Manager Demo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: app shell — side rail on desktop, bottom bar on phone; content as quiet panels, gold reserved for money totals */
:root{
  --chart:#5aaee8;
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1f1d24; --muted:#6c6874; --line:#e4e1da;
  --accent:#6b2a4a; --accent-ink:#ffffff; --gold:#a8781c; --gold-soft:#f5ead2;
  --good:#2f7a4f; --warn:#b5651d; --bad:#b23a3a;
  --font-display:"Outfit",system-ui,sans-serif; --font-body:"Inter",system-ui,sans-serif;
  --font-urdu:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --chart:#7cc4f4;
  --bg:#141218; --panel:#1d1a22; --ink:#ece8f0; --muted:#a39dab; --line:#2f2b36;
  --accent:#c97aa0; --accent-ink:#1a0f15; --gold:#e0b55a; --gold-soft:#3a2f18;
  --good:#5fbf86; --warn:#e3a05a; --bad:#e57373; color-scheme:dark}}
:root[data-theme="dark"]{
  --chart:#7cc4f4;
  --bg:#141218; --panel:#1d1a22; --ink:#ece8f0; --muted:#a39dab; --line:#2f2b36;
  --accent:#c97aa0; --accent-ink:#1a0f15; --gold:#e0b55a; --gold-soft:#3a2f18;
  --good:#5fbf86; --warn:#e3a05a; --bad:#e57373; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:1rem}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:500}
.btn{border:0;border-radius:8px;padding:9px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.danger{background:var(--bad);color:#fff}
.app{display:flex;min-height:100%}
.rail{width:200px;flex-shrink:0;background:var(--panel);border-inline-end:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{padding:0 8px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand b{font-family:var(--font-display);font-size:1.1rem;display:block}
.brand small{color:var(--muted);font-size:.72rem}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:none;cursor:pointer;text-align:start;width:100%;color:var(--muted);font-weight:500}
.nav svg{width:18px;height:18px;flex-shrink:0}
.nav.on{background:var(--gold-soft);color:var(--ink)}
main{flex:1;min-width:0;padding-block:20px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.stat{display:flex;flex-direction:column;gap:2px}
.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat b{font-family:var(--font-display);font-size:1.35rem}
.gold{color:var(--gold)}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate{background:var(--gold-soft);border-radius:10px;padding:10px;text-align:center}
.rate small{display:block;font-size:.72rem;color:var(--muted)}
.rate b{font-family:var(--font-display);font-size:1.05rem}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:start;font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:end}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.72rem;font-weight:600}
.pill.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.off{background:color-mix(in srgb,var(--muted) 15%,transparent);color:var(--muted)}
.pill.due{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.calc{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:10px;padding:12px}
.calc div{display:flex;justify-content:space-between;gap:10px}
.calc .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:700;font-size:1.05rem}
.muted{color:var(--muted)} .small{font-size:.8rem}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.8rem}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:38px;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.bar small{font-size:.68rem;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,8,14,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 12px 20px;overflow:auto;z-index:50}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:440px;padding:18px;display:flex;flex-direction:column;gap:12px}
.receipt{background:#fffdf8;color:#1d1a15;border-radius:8px;padding:16px;border:1px dashed #cdbf9e}
.receipt .ur{font-family:var(--font-urdu);direction:rtl;line-height:2.1}
.receipt h3{text-align:center;font-family:var(--font-display)}
.receipt .line{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;border-bottom:1px dotted #d8ccb0;padding:3px 0}
.receipt .line .ur{font-size:.85rem}
.receipt .big{font-weight:700;font-size:.95rem}
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login .panel{width:100%;max-width:340px;text-align:center}
.demo-tag{font-size:.7rem;background:var(--gold-soft);color:var(--gold);padding:2px 8px;border-radius:99px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.85rem;z-index:60}
@media (max-width:760px){
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));border-inline-end:0;border-top:1px solid var(--line);z-index:40;gap:0}
  .brand{display:none}
  .nav{flex-direction:column;gap:2px;padding:6px 2px;font-size:.62rem;text-align:center;justify-content:center}
  .nav.on{background:none;color:var(--accent)}
  .rates{gap:6px} .rate b{font-size:.92rem}

.headbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:-8px}
.headbar .btn{padding:8px 12px;font-size:.82rem;white-space:nowrap}
.ratepill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--gold);background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:5px 12px;cursor:pointer;font-family:var(--font-body);text-align:start;min-width:0}
.ratepill>span:first-child{font-size:1.15rem;font-weight:800;color:var(--gold);font-family:var(--font-display)}.rp-txt{display:flex;flex-direction:column;line-height:1.25}.ratepill b{font-size:1.08rem}.ratepill small{font-size:.68rem;color:var(--muted);white-space:nowrap}
.rsec{border:1px solid #e3d8bf;border-radius:8px;margin-top:8px;background:#fffaf0}
.rsec summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:700;font-size:.88rem}
.rsec summary::-webkit-details-marker{display:none}
.rsec summary::after{content:"";margin-inline-start:auto;width:8px;height:8px;border-right:2px solid #7a6f5a;border-bottom:2px solid #7a6f5a;transform:rotate(45deg);transition:transform .15s}
.rsec[open] summary::after{transform:rotate(-135deg)}
.rsec .rcount{font-size:.72rem;font-weight:600;background:#f0e4c8;color:#7a5a1c;border-radius:99px;padding:1px 8px}
.rsec .tbl{padding:0 8px 8px}
.rfilter{display:flex;gap:6px;padding:0 8px 8px}.rfilter input,.rfilter select{background:#fff;color:#1d1a15;border-color:#e3d8bf;padding:7px 9px}.rfilter input{flex:1;min-width:0}.rfilter select{width:auto;max-width:45%}
.rsec td.num{white-space:nowrap}.rsec summary::after{margin-top:-4px}.rsec[open] summary::after{margin-top:4px}
.schart{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:90px 1fr auto auto;align-items:center;gap:10px}
.sname{font-weight:600;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strack{display:flex;height:14px;background:var(--bg);border-radius:99px;overflow:hidden;min-width:0}
.sin{background:var(--chart)}.ssold{background:repeating-linear-gradient(45deg,var(--line),var(--line) 4px,transparent 4px,transparent 8px)}
.sval{font-size:.78rem;color:var(--muted);white-space:nowrap}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted)}.sw{display:inline-block;width:12px;height:10px;border-radius:3px}.sw.in{background:var(--chart)}.sw.sold{background:repeating-linear-gradient(45deg,var(--line),var(--line) 3px,transparent 3px,transparent 6px);border:1px solid var(--line);margin-inline-start:6px}
@media (max-width:560px){.srow{grid-template-columns:72px 1fr auto}.srow .sval{display:none}}
.lang{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:5px 12px;font-size:.8rem;font-weight:600;cursor:pointer}
html[lang="ur"] body,html[lang="ur"] h1,html[lang="ur"] h2,html[lang="ur"] h3{font-family:var(--font-urdu)}
html[dir="rtl"] .num{unicode-bidi:plaintext}
html[lang="ur"] body{line-height:2.1}
html[lang="ur"] .stat span,html[lang="ur"] th{text-transform:none;letter-spacing:0}
html[lang="ur"] .num,html[lang="ur"] input[type="number"]{font-family:var(--font-body)}
html[lang="ur"] .lang{font-family:var(--font-body)}
.lang-ur{font-family:var(--font-urdu)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function itemCalc(it){
  const net=Math.max(0,it.gross-it.nag), wast=net*it.wastage/100, goldWt=net+wast;
  const goldVal=val(goldWt,it.karat), maz=it.mazType=="gram"?goldWt*it.mazRate:it.mazRate;
  return {net,wast,goldWt,goldVal,maz,total:goldVal+maz+it.nagPrice};
}

function billTotals(){const sub=cart.reduce((a,it)=>a+itemCalc(it).total,0),ov=oldVal(),disc=num("bDisc");const total=Math.max(0,sub-ov-disc);const p=$("#bPaid")?.value;const paid=p===""||p==null?total:+p;return {sub,ov,disc,total,paid,baqi:total-paid}}
function totals(){const x=billTotals(),tw=cart.reduce((a,it)=>a+itemCalc(it).wast,0),tg=cart.reduce((a,it)=>a+itemCalc(it).goldWt,0);$("#totBox").innerHTML=`

function saveBill(){

  const x=billTotals(),cid=+$("#bCust").value;

  const gold=cart.reduce((a,it)=>a+itemCalc(it).goldWt,0);

  S.bills.push(bill);

/* Tag = first letter of category + 3-digit sequence, e.g. Chain -> C001, C002 */
function nextTag(cat){const p=(String(cat).trim()[0]||"X").toUpperCase();
  const re=new RegExp("^"+p.replace(/[^A-Z0-9]/g,"\\$&")+"(\\d+)$");
  const nums=S.stock.map(s=>String(s.tag).toUpperCase().match(re)).filter(Boolean).map(m=>parseInt(m[1]));
  return p+String((nums.length?Math.max(...nums):0)+1).padStart(3,"0")}
function autoTag(){const el=$("#sTag");if(el)el.value=nextTag($("#sCat").value)}
function addCat(){const n=$("#newCat").value.trim();if(!n)return toast(t("enterName"));
  if(allCats().some(c=>c.toLowerCase()==n.toLowerCase()||catName(c)==n))return toast(t("catExists"));
  (S.settings.cats=S.settings.cats||[]).push(n);save();
  const o=document.createElement("option");o.value=n;o.textContent=n;$("#sCat").appendChild(o);$("#sCat").value=n;
  $("#newCat").value="";$("#catBox").hidden=true;autoTag();toast(t("catAdded"))}
function addStock(){const f=readStockForm();if(!f.tag||f.gross<=0){toast(t("tagWt"));return}
  if(S.stock.some(s=>s.tag==f.tag)){toast(t("tagExists"));return}
  delete f.nagPrice;S.stock.push({...f,sold:false});save();Stock();toast(t("addedStock")+": "+f.tag)}

/* ===== STOCK REPORT (full preview) ===== */
/* Stock level chart: per category, in-stock vs sold weight */
const lowLimit=()=>S.settings.lowLimit??2;
function stockChart(){
  const cats=[...new Set(S.stock.map(s=>s.cat))];
  const rows=cats.map(c=>{const a=S.stock.filter(s=>s.cat==c),i=a.filter(s=>!s.sold),d=a.filter(s=>s.sold);
    return {c,inN:i.length,inW:i.reduce((x,s)=>x+s.gross,0),soldN:d.length,soldW:d.reduce((x,s)=>x+s.gross,0)}}).sort((a,b)=>a.inN-b.inN||a.inW-b.inW);
  const max=Math.max(1,...rows.map(r=>r.inW+r.soldW));
  const lv=r=>r.inN==0?["bad",t("lvOut")]:r.inN<=lowLimit()?["due",t("lvLow")]:["ok",t("lvOk")];
  return `<section class="panel"><div class="row"><h2>${t("stockLevel")}</h2><span class="spacer"></span><span class="legend"><i class="sw in"></i>${t("legIn")}<i class="sw sold"></i>${t("legSold")}</span></div>
  <div class="schart">${rows.map(r=>{const [k,l]=lv(r);return `<div class="srow"><div class="sname">${esc(catName(r.c))}</div>
   <div class="strack"><span class="sin" style="width:${r.inW/max*100}%"></span><span class="ssold" style="width:${r.soldW/max*100}%"></span></div>
   <div class="sval num">${r.inN} ${t("items")} · ${g(r.inW)}</div><span class="pill ${k}">${l}</span></div>`}).join("")}</div>
  <p class="muted small" style="margin:0">${t("lvNote",lowLimit())}</p></section>`}
/* Sort by tag: letter first, then number (R001, R002, R010 ...) */
function tagKey(tag){const m=String(tag).toUpperCase().match(/^([A-Z]*)-?(\d*)/);return [m[1]||"",parseInt(m[2]||"0")]}
function sortByTag(list){return list.slice().sort((a,b)=>{const x=tagKey(a.tag),y=tagKey(b.tag);return x[0]<y[0]?-1:x[0]>y[0]?1:x[1]-y[1]})}
function filterReport(){const q=$("#rSearch").value.trim().toLowerCase(),c=$("#rCat").value;let n=0;
  document.querySelectorAll(".ritem").forEach(r=>{const ok=(!c||r.dataset.cat==c)&&(!q||r.dataset.q.includes(q));r.hidden=!ok;if(ok)n++});$("#rNone").hidden=n>0}

  const all=sum(inS);

  ov.innerHTML=`<div class="modal" style="max-width:640px"><div class="row"><h2>${t("stockReport")}</h2><span class="spacer"></span><button class="btn ghost sm" onclick="this.closest('.overlay').remove()">${t("close")}</button></div>
  <div class="receipt"><h3>${esc(st.shop)}</h3><div style="text-align:center;font-size:.75rem;color:#7a6f5a">${t("stockReport")} · ${new Date().toLocaleDateString(LOC(),{day:"numeric",month:"long",year:"numeric"})}</div>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0">
    <div><small style="color:#7a6f5a">${t("totalItems")}</small><div class="big num">${all.n}</div></div>
    <div><small style="color:#7a6f5a">${t("grossWt")}</small><div class="big num">${g(all.gross)}</div><small class="num">${tmr(all.gross)}</small></div>
    <div><small style="color:#7a6f5a">${t("netGold")}</small><div class="big num">${g(all.net)}</div><small class="num">${tmr(all.net)}</small></div>
    <div><small style="color:#7a6f5a">${t("valueToday")}</small><div class="big num">${rs(all.value)}</div></div>
   </div>
   ${SEC(t("byKarat"),byK.length,T([t("karat"),t("itemsL"),t("weight"),t("tola"),t("value")],byK.map(r=>`<tr><td>${r.k}</td><td class="r num">${r.n}</td><td class="r num">${g(r.net)}</td><td class="r num">${tmr(r.net)}</td><td class="r num">${rs(r.value)}</td></tr>`).join("")))}

   <div><button class="btn" onclick="addKE()">${t("save")}</button></div></section>
  <section class="panel"><h2>${t("history")}</h2><div class="tbl"><table><tr><th>${t("date")}</th><th>${t("entry")}</th><th class="r">${t("gold")}</th><th class="r">Rs</th><th>${t("note")}</th></tr>
   ${ents.map(e=>`<tr><td>${fmtD(e.date)}</td><td>${e.type=="issue"?`<span class="pill due">${t("issue")}</span>`:e.type=="receive"?`<span class="pill ok">${t("receive")}</span>`:`<span class="pill off">${t("payment")}</span>`}</td>
    <td class="r num">${e.type=="issue"?"+"+g(e.wt)+" "+e.karat:e.type=="receive"?"−"+g(e.wt)+(e.wast?`<div class="muted small">${t("wastage")} ${g(e.wast)}</div>`:""):"—"}</td>
    <td class="r num">${e.type=="receive"?rs(e.maz||0):e.type=="pay"?"−"+rs(e.amt):"—"}</td><td class="small">${esc(e.note)}</td></tr>`).join("")}
  </table></div></section>`:""}`;
}
let kType="issue";
function addK(){const n=$("#kName").value.trim();if(!n)return toast(t("enterName"));const id=Math.max(0,...S.karigars.map(k=>k.id))+1;S.karigars.push({id,name:n,phone:$("#kPhone").value});selK=id;save();Karigar()}
function addKE(){const e={kid:selK,date:today(),type:kType,note:$("#keN").value};
  if(kType=="issue"){e.wt=num("keWt");e.karat=$("#keK").value;if(!e.wt)return toast(t("enterWeight"))}
  if(kType=="receive"){e.wt=num("keWt");e.wast=num("keW");e.maz=num("keM");if(!e.wt)return toast(t("enterWeight"))}
  if(kType=="pay"){e.amt=num("keA");if(!e.amt)return toast(t("enterAmount"))}
  S.kentries.push(e);save();Karigar();toast(t("saved"))}

/* ===== CUSTOMER LEDGER (KHATA) ===== */
let selC=null;
function Khata(){
  const c=selC&&cust(selC);
  $("#main").innerHTML=head(t("khataTitle"),t("khataSub"))+`
  <div class="g2"><section class="panel"><h2>${t("customers")}</h2><div class="tbl"><table><tr><th>${t("name")}</th><th class="r">${t("balance")}</th></tr>
   ${S.customers.map(x=>{const b=custBal(x.id);return `<tr style="cursor:pointer" onclick="selC=${x.id};Khata()"><td><b>${esc(x.name)}</b><div class="muted small">${esc(x.phone)}</div></td><td class="r num">${b>0?`<span class="pill due">${t("due",rs(b))}</span>`:b<0?`<span class="pill ok">${t("advance",rs(-b))}</span>`:`<span class="pill off">${t("clear")}</span>`}</td></tr>`}).join("")}
  </table></div>
  <div class="fields"><label>${t("newCustomer")}<input id="cName" placeholder="${t("name")}"></label><label>${t("phone")}<input id="cPhone" placeholder="03xx"></label></div><div><button class="btn sm" onclick="addC()">${t("add")}</button></div></section>
  <section class="panel">${c?`<h2>${esc(c.name)}</h2><div class="stat"><span>${t("balance")}</span><b class="num ${custBal(c.id)>0?"":"gold"}">${rs(custBal(c.id))}</b></div>
   <div class="fields"><label>${t("amountRs")}<input id="lAmt" type="number"></label><label>${t("note")}<input id="lNote" placeholder="${t("collection")} / ${t("advance","").trim()}"></label></div>
   <div class="row"><button class="btn sm" onclick="addL(-1)">${t("gotPayment")}</button><button class="btn ghost sm" onclick="addL(1)">${t("gaveCredit")}</button></div>
   <div class="tbl"><table><tr><th>${t("date")}</th><th>${t("note")}</th><th class="r">Rs</th></tr>${S.ledger.filter(l=>l.cid==c.id).slice().reverse().map(l=>`<tr><td>${fmtD(l.date)}</td><td>${esc(l.note)}</td><td class="r num" style="color:${l.amt>0?"var(--warn)":"var(--good)"}">${l.amt>0?"+":"−"}${rs(Math.abs(l.amt))}</td></tr>`).join("")}</table></div>`
   :`<h2>${t("selectCust")}</h2><p class="muted">${t("selectHint")}</p>`}</section></div>`;
}
function addC(){const n=$("#cName").value.trim();if(!n)return toast(t("enterName"));const id=Math.max(0,...S.customers.map(c=>c.id))+1;S.customers.push({id,name:n,phone:$("#cPhone").value});selC=id;save();Khata()}
function addL(sign){const a=num("lAmt");if(!a)return toast(t("enterAmount"));S.ledger.push({cid:selC,date:today(),amt:sign*a,note:$("#lNote").value||(sign<0?"Collection":"Credit")});save();Khata();toast(t("saved"))}

/* ===== REPORTS ===== */
function Report(){
  const days=[...Array(7)].map((_,i)=>dayISO(6-i));
  const per=days.map(d=>S.bills.filter(b=>b.date==d).reduce((a,b)=>a+b.total,0)),max=Math.max(1,...per);
  const wk=S.bills.filter(b=>days.includes(b.date));
  $("#main").innerHTML=head(t("reports"),t("last7"))+`
  <section class="grid">
   <div class="panel stat"><span>${t("totalSales")}</span><b class="num gold">${rs(wk.reduce((a,b)=>a+b.total,0))}</b></div>
   <div class="panel stat"><span>${t("cashIn")}</span><b class="num">${rs(wk.reduce((a,b)=>a+b.paid,0))}</b></div>
   <div class="panel stat"><span>${t("goldSold")}</span><b class="num">${g(wk.reduce((a,b)=>a+(b.gold||0),0))}</b></div>
   <div class="panel stat"><span>${t("billsL")}</span><b class="num">${wk.length}</b></div></section>
  <section class="panel"><h2>${t("dailySales")}</h2><div class="bars">${days.map((d,i)=>`<div class="bar" title="${rs(per[i])}"><small class="num">${per[i]?Math.round(per[i]/1000)+"k":""}</small><i style="height:${per[i]/max*100}%"></i><small>${fmtD(d)}</small></div>`).join("")}</div></section>
  <section class="panel"><h2>${t("goldWithK")}</h2><div class="tbl"><table><tr><th>${t("karigar")}</th><th class="r">${t("goldBal")}</th><th class="r">${t("makingDue")}</th></tr>${S.karigars.map(k=>{const b=kBal(k.id);return `<tr><td>${esc(k.name)}</td><td class="r num">${g(b.gold)}</td><td class="r num">${rs(b.cash)}</td></tr>`}).join("")}</table></div></section>`;
}

/* ===== SETTINGS ===== */
function Settings(){const st=S.settings;
  $("#main").innerHTML=head(t("settings"),t("settingsSub"))+`
  <section class="panel"><h2>${t("shop")}</h2><div class="fields">
   <label>${t("shopName")}<input id="stShop" value="${esc(st.shop)}"></label><label>${t("ownerName")}<input id="stOwner" value="${esc(st.owner||"")}" placeholder="Haji Muhammad Ali"></label><label>${t("ownerMobile")}<input id="stPhone" type="tel" value="${esc(st.phone)}" placeholder="0300-1234567"></label>
   <label>${t("address")}<input id="stAddr" value="${esc(st.address)}"></label><label>${t("pin")}<input id="stPin" value="${esc(st.pin)}"></label></div></section>
  <section class="panel"><h2>${t("rateTitle")}</h2><div class="fields">${KARATS.map(k=>k=="24K"?`<label>${t("r24")}<input id="r24K" type="number" value="${st.rates["24K"]}" oninput="autoRates()"></label>`:`<label>${k} ${t("auto")}<input id="r${k}" type="number" value="${rateOf(k)}" readonly tabindex="-1" style="opacity:.75"></label>`).join("")}</div>
   <p class="muted small" style="margin:0">${t("rateNote")}</p></section>
  <section class="panel"><h2>${t("rules")}</h2><div class="fields">
   <label>${t("defWastage")}<input id="stW" type="number" step="0.1" value="${st.wastage}"></label>
   <label>${t("makingMethod")}<select id="stMT"><option value="gram" ${st.mazType=="gram"?"selected":""}>${t("perGramOpt")}</option><option value="fixed" ${st.mazType=="fixed"?"selected":""}>${t("fixedItem")}</option></select></label>
   <label>${t("makingRate")}<input id="stMR" type="number" value="${st.mazRate}"></label>
   <label>${t("oldKaat")}<input id="stK" type="number" step="0.1" value="${st.kaat}"></label>
   <label>${t("lowLimitL")}<input id="stLow" type="number" min="0" step="1" value="${lowLimit()}"></label></div></section>
  <section class="panel"><h2>${t("backupTitle")}</h2><p class="muted small" style="margin:0">${t("backupNote")}</p>
   <div class="row"><button class="btn" onclick="downloadBackup()">⬇ ${t("backupDl")}</button>
    <label class="btn ghost" style="flex-direction:row;font-size:inherit;color:var(--ink)">⬆ ${t("backupRestore")}<input id="restoreFile" type="file" accept=".json,application/json" hidden onchange="readBackup(this)"></label></div>
   <div id="restoreBox"></div>
   <span class="muted small">${S.lastBackup?t("lastBackup",new Date(S.lastBackup).toLocaleString(LOC(),{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})):t("noBackup")}</span></section>
  <div class="row"><button class="btn" onclick="saveSet()">${t("saveSettings")}</button><span class="spacer"></span>
   <button class="btn ghost sm" onclick="resetAsk(this)">${t("resetDemo")}</button></div>`;
}
/* ===== BACKUP ===== */
function downloadBackup(){
  S.lastBackup=new Date().toISOString();save();
  const data=JSON.stringify({app:"sarafa-manager",version:1,exported:S.lastBackup,data:S},null,2);
  const shop=(S.settings.shop||"shop").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase();
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
  a.download=`${shop}-backup-${today()}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast(t("backupDone"));Settings()}
let pendingRestore=null;
function readBackup(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);const d=j.data||j;if(!d.settings||!Array.isArray(d.stock))throw 0;
    pendingRestore=d;$("#restoreBox").innerHTML=`<div class="row" style="background:var(--gold-soft);padding:10px;border-radius:8px"><span>${t("restoreAsk",esc(f.name))}</span><span class="spacer"></span><button class="btn danger sm" onclick="doRestore()">${t("restoreYes")}</button><button class="btn ghost sm" onclick="pendingRestore=null;$('#restoreBox').innerHTML=''">${t("cancel")}</button></div>`}
   catch(e){toast(t("badFile"))}inp.value=""};r.readAsText(f)}
function doRestore(){if(!pendingRestore)return;S=pendingRestore;S.mig15=1;pendingRestore=null;cart=[];oldGold=null;save();render();toast(t("restored"))}
function autoRates(){const r=num("r24K");KARATS.forEach(k=>{if(k!="24K")$("#r"+k).value=Math.round(r*parseInt(k)/24)})}
function saveSet(){const st=S.settings;st.shop=$("#stShop").value;st.phone=$("#stPhone").value;st.owner=$("#stOwner").value.trim();st.address=$("#stAddr").value;st.pin=$("#stPin").value||"1234";
  st.rates["24K"]=num("r24K");st.wastage=num("stW");st.mazType=$("#stMT").value;st.mazRate=num("stMR");st.kaat=num("stK");st.lowLimit=Math.max(0,Math.round(num("stLow")));save();render();toast(t("settingsSaved"))}
function resetAsk(b){if(b.dataset.c){S=demoData();cart=[];oldGold=null;save();render();toast(t("demoRestored"))}else{b.dataset.c=1;b.textContent=t("sure");b.classList.add("danger")}}

render();
</script>

</body>
